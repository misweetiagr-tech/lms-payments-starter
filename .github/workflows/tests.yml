name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Node token tests
        working-directory: node-auth
        run: |
          npm install
          npm test

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Run the PHP tests inside the container
        run: "docker compose run --rm --no-deps -e DB_DATABASE=:memory: app php artisan test"

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test through the containers
        run: |
          for port in 8000 4000 5173; do for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:$port/ && break; sleep 2; done; done

          # check <label> <expected status> <curl args...>: print the real status and body, fail clearly.
          check() {
            label="$1"; expected="$2"; shift 2
            status=$(curl -s -o /tmp/body -w "%{http_code}" "$@")
            echo "$label -> $status $(head -c 200 /tmp/body | tr -d '\n')"
            [ "$status" = "$expected" ] || { echo "FAILED: $label expected $expected"; exit 1; }
          }

          check "laravel health" 200 http://localhost:8000/up
          check "node login" 200 -X POST http://localhost:4000/auth/login -H 'Content-Type: application/json' -d '{"user_id":3,"otp":"123456"}'
          TOKEN=$(sed 's/.*"access_token":"\([^"]*\)".*/\1/' /tmp/body)
          check "laravel me with token" 200 http://localhost:8000/api/app/me -H "Authorization: Bearer $TOKEN"
          check "laravel me without token" 401 http://localhost:8000/api/app/me -H 'Accept: application/json'
          check "react proxy to laravel" 200 http://localhost:5173/api/app/me -H "Authorization: Bearer $TOKEN"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --tail=80
          docker compose exec -T app sh -c 'grep -E "^\[20" storage/logs/laravel.log | tail -3 | cut -c1-600' || true
