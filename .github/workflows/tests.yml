name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Node token tests
        working-directory: node-auth
        run: |
          npm install
          npm test

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Run the PHP tests inside the container
        run: "docker compose run --rm --no-deps -e DB_DATABASE=:memory: app php artisan test"

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test through the containers
        run: |
          for port in 8000 4000 5173; do for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:$port/ && break; sleep 2; done; done
          curl -sf http://localhost:8000/up
          TOKEN=$(curl -sf -X POST http://localhost:4000/auth/login -H 'Content-Type: application/json' -d '{"user_id":3,"otp":"123456"}' | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
          curl -sf http://localhost:8000/api/app/me -H "Authorization: Bearer $TOKEN"
          curl -sf http://localhost:5173/api/app/me -H "Authorization: Bearer $TOKEN"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=80
